[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytx"
version = "0.1.0"
description = "Read-only, agent-friendly YouTube CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jake Steele" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "google-api-python-client>=2.164.0",
  "google-auth>=2.38.0",
  "google-auth-oauthlib>=1.2.1",
  "pydantic>=2.10.6",
  "keyring>=25.6.0",
  "python-dateutil>=2.9.0.post0",
  "cryptography>=44.0.2",
  "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=5.0.0",
  "pre-commit>=3.7.0",
  "ruff==0.11.12",
]

[project.urls]
Repository = "https://github.com/jastee07/ytx"
Issues = "https://github.com/jastee07/ytx/issues"

[project.scripts]
ytx = "ytx.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
