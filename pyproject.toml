[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytx"
version = "0.1.0"
description = "Read-only, agent-friendly YouTube CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "google-api-python-client>=2.164.0",
  "google-auth>=2.38.0",
  "google-auth-oauthlib>=1.2.1",
  "pydantic>=2.10.6",
  "keyring>=25.6.0",
  "python-dateutil>=2.9.0.post0",
  "cryptography>=44.0.2",
  "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=5.0.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
ytx = "ytx.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
